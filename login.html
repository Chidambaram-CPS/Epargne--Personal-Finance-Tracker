<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Tracker – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center text-white">
  <!-- Login Container -->
  <main class="w-full max-w-md bg-slate-800 rounded-2xl p-8 shadow-xl">
    <!-- Header -->
    <header>
      <h1 id="app-title" class="text-3xl font-bold text-center mb-6">Money Tracker</h1>
    </header>

    <!-- Login Form -->
    <form id="login-form" class="space-y-4">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email-input" class="sr-only">Email Address</label>
        <input
          id="email-input"
          name="email"
          type="email"
          placeholder="Email"
          required
          class="w-full px-4 py-3 rounded-xl bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          autocomplete="email"
        />
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password-input" class="sr-only">Password</label>
        <input
          id="password-input"
          name="password"
          type="password"
          placeholder="Password"
          required
          class="w-full px-4 py-3 rounded-xl bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          autocomplete="current-password"
        />
      </div>

      <!-- Submit Button -->
      <button
        id="login-btn"
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 transition py-3 rounded-xl font-semibold"
      >
        Login
      </button>
    </form>
  </main>

  <!-- Scripts -->
  <script src="./js/login.js"></script>
</body>
</html>
