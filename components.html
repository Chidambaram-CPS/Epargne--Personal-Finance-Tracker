<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design System</title>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111;
      --muted: #777;
      --border: #e5e7eb;
      --primary: #000;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    .app {
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 28px 0 12px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* BUTTON */
    .btn {
      height: 44px;
      padding: 0 20px;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      cursor: pointer;
    }

    /* INPUT */
    .input {
      height: 48px;
      width: 100%;
      max-width: 260px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    /* CARD */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      width: 100%;
      max-width: 280px;
    }

    /* TRANSACTION ITEM */
    .transaction {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .transaction small {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }

    /* BOTTOM NAV */
    .nav {
      height: 64px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 12px;
    }

    .fab {
      width: 52px;
      height: 52px;
      background: var(--primary);
      border-radius: 50%;
      margin-top: -28px;
    }

    /* SECTION CARD */
    .section {
      margin-bottom: 32px;
    }

    /* TABLET CENTER */
    @media (min-width: 768px) {
      .app {
        max-width: 420px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Design System</h1>

  <!-- BUTTON -->
  <div class="section">
    <h2>Button</h2>
    <div class="row">
      <div class="btn">Primary Button</div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="section">
    <h2>Input Field</h2>
    <div class="row">
      <div class="input">Placeholder text</div>
    </div>
  </div>

  <!-- CARD -->
  <div class="section">
    <h2>Card</h2>
    <div class="row">
      <div class="card">
        Card content placeholder
      </div>
    </div>
  </div>

  <!-- TRANSACTION ITEM -->
  <div class="section">
    <h2>Transaction Item</h2>
    <div class="row">
      <div class="transaction">
        <div>
          <strong>Category</strong>
          <small>Date</small>
        </div>
        <strong>₹0.00</strong>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="section">
    <h2>Bottom Navigation</h2>
    <div class="nav">
      <span>Home</span>
      <span>Transactions</span>
      <div class="fab"></div>
      <span>Insights</span>
      <span>Settings</span>
    </div>
  </div>

</div>

</body>
</html>
