<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transactions</title>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111;
      --muted: #777;
      --border: #e5e7eb;
      --primary: #000;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      padding-bottom: 24px;
    }

    /* HEADER */
    header {
      height: 56px;
      background: var(--card);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .filter {
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
    }

    /* SEARCH */
    .search-wrap {
      padding: 16px;
    }

    .search {
      height: 44px;
      background: var(--card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: var(--muted);
    }

    /* LIST */
    .list {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transaction {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
    }

    .transaction:hover {
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }

    .left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .left strong {
      font-size: 15px;
      font-weight: 600;
    }

    .left small {
      font-size: 12px;
      color: var(--muted);
    }

    .amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    /* TABLET CENTER */
    @media (min-width: 768px) {
      .app {
        max-width: 420px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <h1>Transactions</h1>
    <div class="filter">☰</div>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search">
      Search transactions
    </div>
  </div>

  <!-- TRANSACTION LIST -->
  <div class="list">

    <div class="transaction">
      <div class="left">
        <strong>Category</strong>
        <small>Date</small>
      </div>
      <div class="amount">₹0.00</div>
    </div>

    <div class="transaction">
      <div class="left">
        <strong>Category</strong>
        <small>Date</small>
      </div>
      <div class="amount">₹0.00</div>
    </div>

    <div class="transaction">
      <div class="left">
        <strong>Category</strong>
        <small>Date</small>
      </div>
      <div class="amount">₹0.00</div>
    </div>

    <div class="transaction">
      <div class="left">
        <strong>Category</strong>
        <small>Date</small>
      </div>
      <div class="amount">₹0.00</div>
    </div>

  </div>

</div>

</body>
</html>
